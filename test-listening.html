<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kỹ Năng Nghe — Venus English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
.test-layout{display:grid;grid-template-columns:220px 1fr;gap:0;min-height:calc(100vh - 56px);}
@media(max-width:700px){.test-layout{grid-template-columns:1fr;}.nav-panel{display:none;}.nav-panel.mobile-show{display:block;}}
.listen-qgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:820px){.listen-qgrid{grid-template-columns:1fr;}}
.nav-panel{background:var(--white);border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;}
.nav-panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-lt);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.q-nav-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:16px;}
.q-nav-btn{aspect-ratio:1;border:1.5px solid var(--border);border-radius:6px;font-size:12px;font-weight:600;background:var(--white);cursor:pointer;transition:all .15s;color:var(--text-md);display:flex;align-items:center;justify-content:center;}
.q-nav-btn:hover{border-color:var(--brand);color:var(--ink);background:var(--tint);}
.q-nav-btn.answered{background:var(--ink);border-color:var(--ink);color:var(--white);}
.q-nav-btn.current{border-color:var(--brand);background:var(--brand);color:var(--white);box-shadow:0 2px 8px rgba(6,54,114,.3);}
.nav-legend{font-size:11px;color:var(--text-lt);}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.legend-dot{width:14px;height:14px;border-radius:3px;flex-shrink:0;}
.timer-box{background:var(--brand);border-radius:var(--r-sm);padding:10px 12px;text-align:center;margin-bottom:14px;}
.timer-label{font-size:10px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
.timer-value{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--white);letter-spacing:1px;}
.nav-progress{margin-bottom:14px;}
.nav-progress-bar{width:100%;height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px;}
.nav-progress-fill{height:100%;background:var(--ink);border-radius:3px;transition:width .3s;}
.nav-progress-txt{font-size:11px;color:var(--text-lt);display:flex;justify-content:space-between;margin-top:3px;}
.main-content{padding:24px 28px;max-width:1100px;width:100%;}
@media(max-width:700px){.main-content{padding:14px 12px;}}
.qblock-active{animation:slideIn .25s ease;}
@keyframes slideIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.q-nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);gap:10px;}
.part-badge{display:inline-block;background:var(--brand);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;letter-spacing:.5px;margin-bottom:8px;}
.mobile-nav-toggle{display:none;background:var(--brand);color:var(--white);border:none;border-radius:var(--r-sm);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);}
@media(max-width:700px){.mobile-nav-toggle{display:inline-flex;}}
</style>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbwwx6KoClB_kwvEOC4-5lQcQgh6J8n0xm1x3SI33EHxzhc5PXugKlrVsNSdUnDjZDVZ/exec';
const Session={get:()=>{try{return JSON.parse(sessionStorage.getItem('ve_user')||'null');}catch(e){return null;}},set:(d)=>sessionStorage.setItem('ve_user',JSON.stringify(d)),clear:()=>sessionStorage.removeItem('ve_user'),require:(to)=>{var u=Session.get();if(!u){location.href=(to||'login.html');return null;}return u;},tGet:()=>sessionStorage.getItem('ve_teacher'),tSet:(p)=>sessionStorage.setItem('ve_teacher',p),tClear:()=>sessionStorage.removeItem('ve_teacher'),tRequire:()=>{var p=sessionStorage.getItem('ve_teacher');if(!p){location.href='teacher.html';return null;}return p;}};
async function api(action,payload,msg){payload=payload||{};msg=msg||'Đang xử lý...';showLoading(true,msg);try{var r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action:action},payload)),redirect:'follow'});return await r.json();}catch(e){return{ok:false,error:'Lỗi kết nối: '+e.message};}finally{showLoading(false);}}
function showLoading(on,msg){var el=document.getElementById('ov');if(!el)return;document.getElementById('ovMsg').textContent=msg||'Đang xử lý...';el.style.display=on?'flex':'none';}
function showErr(id,msg){var el=document.getElementById(id);if(!el)return;el.textContent=msg;el.style.display='block';}
function hideErr(id){var el=document.getElementById(id);if(el)el.style.display='none';}
</script>
</head>
<body class="light">
<div id="ov" style="display:none"><div class="spinner"></div><p id="ovMsg">Đang nộp bài...</p></div>

<nav class="nav" style="position:sticky;top:0;z-index:200">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="btn btn-ghost btn-sm" onclick="goBack()">← Thoát</button>
    <button class="mobile-nav-toggle" onclick="toggleMobileNav()">☰ Số câu</button>
  </div>
  <div class="nav-brand"><div class="nav-brand-dot"></div>Kỹ Năng Nghe</div>
  <div class="nav-r"><span class="txt-sm" id="cnt" style="min-width:50px;text-align:right">0 / 24</span></div>
</nav>

<div class="test-layout">
  <!-- LEFT NAV -->
  <div class="nav-panel" id="navPanel">
    <div class="timer-box"><div class="timer-label">Thời gian</div><div class="timer-value" id="timerVal">00:00</div></div>
    <div class="nav-progress">
      <div class="nav-progress-txt"><span>Đã trả lời</span><span id="navPrgTxt">0 / 24</span></div>
      <div class="nav-progress-bar"><div class="nav-progress-fill" id="navPrgFill" style="width:0%"></div></div>
    </div>
    <div class="nav-panel-title">Câu hỏi</div>
    <div class="q-nav-grid" id="qNavGrid"></div>
    <div class="nav-legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--ink)"></div><span>Đã trả lời</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--brand)"></div><span>Câu hiện tại</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--white);border:1.5px solid var(--border)"></div><span>Chưa trả lời</span></div>
    </div>
    <button class="btn btn-primary btn-full" style="margin-top:16px" onclick="submitListening()">Nộp bài →</button>
  </div>

  <!-- RIGHT CONTENT -->
  <div class="main-content">
    <div class="alert al-warn show" style="margin-bottom:16px">
      🎧 Nghe từng đoạn audio rồi trả lời câu hỏi. Mỗi đoạn có thể nghe lại tối đa 3 lần. Kết quả không hiển thị ngay — giáo viên tổng hợp sau.
    </div>
    <div id="questionArea"></div>
    <div class="q-nav-row">
      <button class="btn btn-ghost" id="btnPrev" onclick="goPrev()">← Câu trước</button>
      <span class="txt-sm" id="qPositionTxt" style="color:var(--text-lt)">Câu 1 / 24</span>
      <button class="btn btn-primary btn-sm" id="btnNext" onclick="goNext()">Câu sau →</button>
    </div>
    <div id="submitErr" class="al-error" style="display:none;margin-top:16px"></div>
  </div>
</div>

<script>var user = Session.require();
if (!user) { location.href = 'login.html'; }
else if (user && user.listeningDone) { location.href = 'dashboard.html'; }

var answers = {};
var plays = {};
var currentQ = 1;
var totalQ = 24;
var timerSec = 0;
var timerInterval = null;
var pageHidden = false;
var tabHiddenAt = 0;
var AUDIO = {1:'audio/part1.mp3',2:'audio/part2.mp3',3:'audio/part3.mp3',4:'audio/part4.mp3',5:'audio/part5.mp3',6:'audio/part6.mp3'};
var ALL_QS = [];
var PARTS = [
  {p:1,lbl:'Part 1 — Câu 1–4',qs:[
  {n:1,q:"Where is the woman from?",o:["a. Australia","b. Croatia","c. Germany","d. Russia"]},
  {n:2,q:"She says you can travel from Croatia to Germany in two hours by ________.",o:["a. bus","b. train","c. car","d. plane"]},
  {n:3,q:"What does the man think?",o:["a. His geography is very good","b. He doesn't know enough about geography","c. The woman is from Germany","d. Croatia is part of Germany"]},
  {n:4,q:"What does the woman think of the man's mistake?",o:["a. It's stupid","b. It's very serious","c. It's funny","d. It's not serious"]},
  ]},
  {p:2,lbl:'Part 2 — Câu 5–8',qs:[
  {n:5,q:"What are they looking at?",o:["a. a newspaper","b. an email","c. a story in a book","d. a picture or a photo"]},
  {n:6,q:"Who is the person they're looking at?",o:["a. the woman's father's older brother","b. the man's mother's older brother","c. the man's father's younger brother","d. the man's father's older brother"]},
  {n:7,q:"The woman thinks the man's uncle _________.",o:["a. looks kind","b. is handsome","c. is kind","d. looks unfriendly"]},
  {n:8,q:"Why doesn't the man see his uncle very much?",o:["a. His uncle's wife and his dad don't get along","b. His uncle lives too far away","c. His uncle and his dad don't have a good relationship","d. His mum and his uncle don't have a good relationship"]},
  ]},
  {p:3,lbl:'Part 3 — Câu 9–12',qs:[
  {n:9,q:"Where is this conversation taking place?",o:["a. a bar","b. a restaurant","c. a supermarket","d. someone's house"]},
  {n:10,q:"What problem does the man mention?",o:["a. They only serve fish","b. There isn't any more salmon","c. It's very busy today","d. They don't sell salmon"]},
  {n:11,q:"When the man tells the woman she can't have salmon, she is _________.",o:["a. a little disappointed","b. very angry","c. a bit sad","d. quite irritated"]},
  {n:12,q:"What does the man do?",o:["a. He tells the woman he'll choose for her","b. He suggests a similar dish","c. He apologises many times","d. He tries to sell a more expensive dish"]},
  ]},
  {p:4,lbl:'Part 4 — Câu 13–16',qs:[
  {n:13,q:"The woman _________.",o:["a. is very late","b. is on time","c. is a bit late","d. is early"]},
  {n:14,q:"The woman _________.",o:["a. doesn't feel well","b. doesn't want to go anywhere","c. doesn't know where to go","d. doesn't want to walk far"]},
  {n:15,q:"Why is the man surprised?",o:["a. The woman is so late","b. The woman has been to the place before","c. The woman doesn't know where the place is","d. The woman is wearing such unsuitable shoes"]},
  {n:16,q:"Which is true about the woman?",o:["a. She would have gone if her friend hadn't come","b. She would have gone if her friend had come","c. She went there last week","d. She wishes her friend were with her now"]},
  ]},
  {p:5,lbl:'Part 5 — Câu 17–20',qs:[
  {n:17,q:"Where are the speakers?",o:["a. a shop","b. a restaurant","c. the woman's house","d. a cinema"]},
  {n:18,q:"What does the woman do?",o:["a. She rudely refuses a refund","b. She politely refuses a refund","c. She considers giving a refund","d. She agrees to give a refund"]},
  {n:19,q:"Why is the product now ruined?",o:["a. He dropped it","b. He didn't look after it properly","c. The product was low quality","d. The product was faulty"]},
  {n:20,q:"What does the man do?",o:["a. He complains he was not given instructions","b. He blames the woman","c. He accepts the woman's decision","d. He does not accept the woman's decision"]},
  ]},
  {p:6,lbl:'Part 6 — Câu 21–24',qs:[
  {n:21,q:"How does the woman feel?",o:["a. appalled","b. anxious","c. scared","d. surprised"]},
  {n:22,q:"How does the man act?",o:["a. dismissively","b. sympathetically","c. flirtatiously","d. reassuringly"]},
  {n:23,q:"Which is true of the person they're talking about?",o:["a. She has forgotten many important things before","b. She never usually forgets things","c. She often forgets things","d. She doesn't have a mobile phone"]},
  {n:24,q:"What does the man decide to do?",o:["a. call from the woman's mobile","b. send her an email","c. call from a different telephone","d. call from his mobile phone"]},
  ]},
  ]

if (user && !user.listeningDone) {
  PARTS.forEach(function(pt){ pt.qs.forEach(function(q){ q.part = pt.p; ALL_QS.push(q); }); });
  api('trackActivity', {username:user.username, testType:'listening', action:'enter', note:'Start session'});
  buildNavGrid();
  showQuestion(1);
  startTimer();
}

function startTimer() {
  timerInterval = setInterval(function() {
    timerSec++;
    var m = Math.floor(timerSec/60), s = timerSec%60;
    document.getElementById('timerVal').textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }, 1000);
}

// ── BUILD NAV GRID ──
function buildNavGrid() {
  var grid = document.getElementById('qNavGrid');
  grid.innerHTML = '';
  ALL_QS.forEach(function(q) {
    var btn = document.createElement('button');
    btn.className = 'q-nav-btn' + (q.n === currentQ ? ' current' : '');
    btn.textContent = q.n;
    btn.id = 'navbtn' + q.n;
    btn.title = 'Part ' + q.part;
    (function(n){ btn.onclick = function(){ goToQuestion(n); }; })(q.n);
    grid.appendChild(btn);
  });
}

// ── SHOW QUESTION ──
function showQuestion(n) {
  currentQ = n;
  var q = ALL_QS.find(function(x){ return x.n===n; });
  if (!q) return;
  var pt = PARTS.find(function(p){ return p.p===q.part; });
  var area = document.getElementById('questionArea');
  // Render the full part (audio + all 4 questions)
  var playCount = plays[q.part]||0;
  var playsLeft = Math.max(0,4-playCount);
  var isLocked = playCount >= 4;

  var html = '<div class="qblock qblock-active" style="padding:24px 28px">'
    + '<div class="audio-wrap" style="margin-bottom:20px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">'
    + '<div><div class="audio-label">'+pt.lbl+'</div>'
    + '<div style="font-size:12px;color:rgba(255,255,255,.7)">Câu '+pt.qs[0].n+'–'+pt.qs[pt.qs.length-1].n+'</div></div>'
    + '<span style="font-size:12px;font-weight:600;'+(isLocked?'color:#fca5a5':'color:rgba(255,255,255,.85)')+'" id="playsLeft_'+q.part+'">'
    + (isLocked?'🔒 Đã hết lượt — bị khóa':'Còn '+playsLeft+' lần') + '</span>'
    + '</div>'
    + '<audio controls id="aud'+q.part+'" src="'+AUDIO[q.part]+'" onplay="trackPlay('+q.part+')" style="width:100%;margin-top:8px;height:36px'+(isLocked?';opacity:.4;pointer-events:none':'')+'" preload="none"></audio>'
    + '</div>'
    + '<div class="listen-qgrid">'
    + pt.qs.map(function(pq){
        var sel = answers[pq.n]||null;
        return '<div class="qblock" id="qb'+pq.n+'" style="margin-bottom:0">'
          +'<div class="q-num">Câu '+pq.n+'</div>'
          +'<div class="q-text" id="qtxt'+pq.n+'">'+pq.q+'</div>'
          +'<div class="q-opts">'
          +pq.o.map(function(opt,i){
            var l=['a','b','c','d'][i];
            var isSel=sel===l;
            return '<label class="q-opt'+(isSel?' on':'')+'" id="qo'+pq.n+'_'+l+'">'
              +'<input type="radio" name="q'+pq.n+'" value="'+l+'"'+(isSel?' checked':'')
              +' onchange="pick('+pq.n+',\''+l+'\')">'
              +' '+opt+'</label>';
          }).join('')+'</div></div>';
      }).join('')
    + '</div></div>';

  area.innerHTML = html;

  // Update nav buttons
  document.querySelectorAll('.q-nav-btn').forEach(function(b,i) {
    var qn = ALL_QS[i].n;
    b.classList.remove('current','answered');
    if (qn===n) b.classList.add('current');
    else if (answers[qn]) b.classList.add('answered');
  });

  document.getElementById('qPositionTxt').textContent = 'Câu '+n+' / '+totalQ;
  document.getElementById('btnPrev').disabled = (n<=1);
  document.getElementById('btnNext').textContent = n<totalQ?'Câu sau →':'Xem lại & Nộp';
  window.scrollTo(0,56);
  setTimeout(function(){ protectAllQuestions(); }, 150);
}

function goToQuestion(n) { if(n>=1&&n<=totalQ) showQuestion(n); }
function goNext() {
  if(currentQ<totalQ){goToQuestion(currentQ+1);return;}
  var una=ALL_QS.map(function(q){return q.n;}).filter(function(n){return!answers[n];});
  if(una.length>0){
    document.getElementById('submitErr').textContent='Còn '+una.length+' câu chưa trả lời.';
    document.getElementById('submitErr').style.display='block';
    una.forEach(function(n){var b=document.getElementById('navbtn'+n);if(b)b.style.background='#fef3c7';});
    goToQuestion(una[0]);
  }else{submitListening();}
}
function goPrev(){if(currentQ>1)goToQuestion(currentQ-1);}

function trackPlay(p) {
  plays[p]=(plays[p]||0)+1;
  var left=Math.max(0,3-plays[p]);
  var el=document.getElementById('playsLeft_'+p);
  if(el)el.textContent=left>0?'Còn nghe '+left+' lần':'🔒 Đã hết lượt nghe — bị khóa';
}

function pick(n,l) {
  answers[n]=l;
  ['a','b','c','d'].forEach(function(x){
    var el=document.getElementById('qo'+n+'_'+x);
    if(el)el.classList.toggle('on',x===l);
  });
  var btn=document.getElementById('navbtn'+n);
  if(btn){btn.style.background='';btn.classList.remove('current');btn.classList.add('answered');}
  document.querySelectorAll('.q-nav-btn').forEach(function(b,i){if(ALL_QS[i].n===currentQ)b.classList.add('current');});
  updateProgress();
}

function updateProgress() {
  var cnt=Object.keys(answers).length;
  document.getElementById('cnt').textContent=cnt+' / 24';
  document.getElementById('navPrgTxt').textContent=cnt+' / 24';
  document.getElementById('navPrgFill').style.width=(cnt/24*100)+'%';
}

async function submitListening() {
  var una=ALL_QS.map(function(q){return q.n;}).filter(function(n){return!answers[n];});
  var errEl=document.getElementById('submitErr');
  if(una.length>0){
    errEl.textContent='Còn '+una.length+' câu chưa trả lời. Vui lòng trả lời đủ.';
    errEl.style.display='block';
    una.forEach(function(n){var b=document.getElementById('navbtn'+n);if(b)b.style.background='#fef3c7';});
    goToQuestion(una[0]); return;
  }
  errEl.style.display='none';
  clearInterval(timerInterval);
  var res=await api('submitListening',{username:user.username,answers:answers});
  if(!res.ok){errEl.textContent=res.error;errEl.style.display='block';return;}
  user.listeningDone=true; Session.set(user);
  location.href='done.html?test=listening';
}

// ── EXIT TRACKING ──
function goBack() {
  var confirmed=confirm('Bạn có chắc muốn thoát?\n\n⚠️ Giáo viên sẽ ghi nhận bạn đã thoát khỏi bài thi này.\nHành động này sẽ được ghi lại trong hệ thống.\n\nNhấn OK để thoát, Cancel để tiếp tục làm bài.');
  if(confirmed){
    clearInterval(timerInterval);
    api('trackActivity',{username:user.username,testType:'listening',action:'exit',
      note:'Thoat sau '+timerSec+'giay, da lam '+Object.keys(answers).length+'/24 cau'});
    setTimeout(function(){location.href='dashboard.html';},200);
  }
}

var tabHiddenAt = 0;
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    pageHidden=true;
    tabHiddenAt=Date.now();
    if(timerInterval) clearInterval(timerInterval);
    api('trackActivity',{username:user.username,testType:'listening',action:'tab_hidden',note:'Chuyen tab luc '+timerSec+'giay'});
  }else if(pageHidden){
    pageHidden=false;
    var awaySec=Math.round((Date.now()-tabHiddenAt)/1000);
    api('trackActivity',{username:user.username,testType:'listening',action:'tab_returned',note:'Quay lai sau '+awaySec+'giay roi khoi tab'});
    if(typeof startTimer==='function') startTimer();
    showTabWarning();
  }
});

function showTabWarning(){
  var ov=document.createElement('div');
  ov.id='tabWarnOverlay';
  ov.style.cssText='position:fixed;inset:0;background:rgba(155,11,34,.96);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:32px;font-family:var(--font);';
  ov.innerHTML='<div style="font-size:48px;margin-bottom:16px">⚠️</div>'
    +'<h2 style="font-family:var(--serif);font-size:24px;margin-bottom:12px">Bạn vừa chuyển tab!</h2>'
    +'<p style="font-size:16px;max-width:480px;line-height:1.6;margin-bottom:24px">Hành động này đã được ghi nhận và sẽ thông báo cho giáo viên biết. Vui lòng tiếp tục làm bài và không rời khỏi trang trong lúc thi.</p>'
    +'<button id="tabWarnClose" style="background:#fff;color:#dc2626;border:none;padding:12px 32px;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer">Tôi đã hiểu, tiếp tục làm bài</button>';
  document.body.appendChild(ov);
  document.getElementById('tabWarnClose').onclick=function(){ov.remove();};
}

document.addEventListener('contextmenu',function(e){e.preventDefault();return false;});
document.addEventListener('keydown',function(e){
  if(e.ctrlKey&&(e.key==='c'||e.key==='C'||e.key==='u'||e.key==='U'||e.key==='s'||e.key==='S')){e.preventDefault();return false;}
  if(e.key==='F12'){e.preventDefault();return false;}
  if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='i'||e.key==='J'||e.key==='j'||e.key==='C'||e.key==='c')){e.preventDefault();return false;}
});

window.addEventListener('beforeunload',function(e){
  if(!user.listeningDone){e.preventDefault();e.returnValue='Bạn có chắc muốn thoát?';return e.returnValue;}
});

function toggleMobileNav(){document.getElementById('navPanel').classList.toggle('mobile-show');}
</script>
<script>


// ═══════════════════════════════════════
// CANVAS QUESTION RENDERER
// Renders question text as PNG image — blocks copy/translate/select
// ═══════════════════════════════════════
function renderQuestionAsImage(text, maxWidth) {
  maxWidth = maxWidth || 600;
  var dpr = window.devicePixelRatio || 1;
  var fontSize = 17;
  var lineHeight = fontSize * 1.6;
  var padding = 0;
  var fontFace = '500 ' + fontSize + 'px "Be Vietnam Pro", system-ui, sans-serif';

  // Measure and wrap text
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d');
  ctx.font = fontFace;

  function wrapText(txt, maxW) {
    var words = txt.split(' ');
    var lines = [];
    var current = '';
    words.forEach(function(w) {
      var test = current ? current + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && current) {
        lines.push(current);
        current = w;
      } else {
        current = test;
      }
    });
    if (current) lines.push(current);
    return lines;
  }

  var usableWidth = maxWidth - padding * 2;
  var lines = wrapText(text, usableWidth);
  var h = lines.length * lineHeight + padding * 2;

  canvas.width = maxWidth * dpr;
  canvas.height = h * dpr;
  canvas.style.width = maxWidth + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  // Background transparent
  ctx.clearRect(0, 0, maxWidth, h);

  // Text
  ctx.font = fontFace;
  ctx.fillStyle = '#16181D';
  ctx.textBaseline = 'top';
  lines.forEach(function(line, i) {
    ctx.fillText(line, padding, padding + i * lineHeight);
  });

  var img = new Image();
  img.src = canvas.toDataURL('image/png');
  img.style.display = 'block';
  img.style.userSelect = 'none';
  img.style.webkitUserSelect = 'none';
  img.style.pointerEvents = 'none';
  img.style.maxWidth = '100%';
  img.draggable = false;
  return img;
}

function renderOptionAsImage(text, maxWidth) {
  maxWidth = maxWidth || 560;
  var dpr = window.devicePixelRatio || 1;
  var fontSize = 16;
  var lineHeight = fontSize * 1.55;
  var fontFace = fontSize + 'px "Be Vietnam Pro", system-ui, sans-serif';

  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d');
  ctx.font = fontFace;

  function wrapText(txt, maxW) {
    var words = txt.split(' ');
    var lines = []; var current = '';
    words.forEach(function(w) {
      var test = current ? current + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && current) { lines.push(current); current = w; }
      else { current = test; }
    });
    if (current) lines.push(current);
    return lines;
  }

  var lines = wrapText(text, maxWidth);
  var h = lines.length * lineHeight + 4;
  canvas.width = maxWidth * dpr;
  canvas.height = h * dpr;
  canvas.style.width = maxWidth + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, maxWidth, h);
  ctx.font = fontFace;
  ctx.fillStyle = '#4A4F5A';
  ctx.textBaseline = 'top';
  lines.forEach(function(line, i) { ctx.fillText(line, 0, 2 + i * lineHeight); });

  var img = new Image();
  img.src = canvas.toDataURL('image/png');
  img.style.display = 'block';
  img.style.userSelect = 'none';
  img.style.webkitUserSelect = 'none';
  img.style.pointerEvents = 'none';
  img.style.maxWidth = '100%';
  img.draggable = false;
  return img;
}

// Apply to all .q-text and .q-opt label text
function protectAllQuestions() {
  var container = document.getElementById('qs') || document.getElementById('parts');
  if (!container) return;
  var maxW = Math.min(container.offsetWidth - 32, 620);

  // Replace q-text content with canvas image
  container.querySelectorAll('.q-text').forEach(function(el) {
    var txt = el.textContent.trim();
    if (!txt) return;
    el.innerHTML = '';
    el.appendChild(renderQuestionAsImage(txt, maxW));
  });

  // Replace option text (keep radio input, replace text node)
  container.querySelectorAll('.q-opt').forEach(function(label) {
    var input = label.querySelector('input');
    var txt = label.textContent.trim();
    if (!txt || !input) return;
    label.innerHTML = '';
    label.appendChild(input);
    label.appendChild(renderOptionAsImage(txt, maxW - 32));
    label.style.alignItems = 'center';
    label.style.gap = '10px';
  });
}

// Anti-copy/translate measures
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('selectstart', function(e) {
  // Allow selecting form inputs
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  e.preventDefault();
});
document.addEventListener('copy', function(e) { e.preventDefault(); });
document.addEventListener('keydown', function(e) {
  // Block Ctrl+A, Ctrl+C, Ctrl+U (view source)
  if (e.ctrlKey && (e.key==='a'||e.key==='c'||e.key==='u'||e.key==='s')) e.preventDefault();
  // Block F12
  if (e.key==='F12') e.preventDefault();
});

// Call after questions are rendered
window.addEventListener('load', function() {
  setTimeout(protectAllQuestions, 100);
});

</script>
