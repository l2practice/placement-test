<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nộp Bài Thành Công — Venus English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div class="success-wrap">
  <div class="success-box card" style="padding:28px 22px">
    <div class="success-icon-wrap" id="sIcon">✅</div>
    <h1 id="sTitle">Nộp bài thành công!</h1>
    <p id="sMsg"></p>

    <div class="alert al-info show" id="sNote" style="text-align:left;margin-bottom:20px"></div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <a href="dashboard.html" class="btn btn-primary btn-full">← Về tổng quan</a>
      <div id="sNext"></div>
    </div>
  </div>
</div>

<script>
var p = new URLSearchParams(location.search);
var test = p.get('test') || 'vg';

var CFG = {
  vg: {
    icon:'📝', title:'Hoàn thành Ngữ Pháp & Từ Vựng!',
    msg:'Cảm ơn bạn đã hoàn thành phần thi Ngữ Pháp & Từ Vựng.',
    note:'Kết quả sẽ được tổng hợp sau khi bạn hoàn thành tất cả các phần. Giáo viên sẽ thông báo level sau.',
    next: {url:'test-writing.html', lbl:'Tiếp tục bài Viết →'}
  },
  writing: {
    icon:'✍️', title:'Hoàn thành bài Viết!',
    msg:'Cảm ơn bạn đã hoàn thành phần thi Viết.',
    note:'Bài viết sẽ được giáo viên chấm và nhận xét chi tiết. Kết quả gửi qua email.',
    next: {url:'test-listening.html', lbl:'Tiếp tục bài Nghe →'}
  },
  listening: {
    icon:'🎧', title:'Hoàn thành bài Nghe!',
    msg:'Cảm ơn bạn đã hoàn thành phần thi Nghe.',
    note:'Kết quả Nghe sẽ được tổng hợp cùng với các phần thi khác.',
    next: {url:'test-speaking.html', lbl:'Tiếp tục bài Nói →'}
  },
  speaking: {
    icon:'🎙️', title:'Hoàn thành tất cả bài thi!',
    msg:'Cảm ơn bạn đã hoàn thành toàn bộ 4 phần kiểm tra của Venus English.',
    note:'🎉 Giáo viên sẽ chấm bài và gửi kết quả + nhận xét chi tiết đến email của bạn. Vui lòng chờ thông báo từ Venus English.',
    next: null
  }
};

var cfg = CFG[test] || CFG.vg;
document.getElementById('sIcon').textContent = cfg.icon;
document.getElementById('sTitle').textContent = cfg.title;
document.getElementById('sMsg').textContent = cfg.msg;
document.getElementById('sNote').innerHTML = cfg.note;

if (cfg.next) {
  document.getElementById('sNext').innerHTML =
    '<a href="'+cfg.next.url+'" class="btn btn-outline btn-full">'+cfg.next.lbl+'</a>';
}
</script>
</body>
</html>
