<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ngữ Pháp & Từ Vựng — Venus English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* ── 2-COLUMN TEST LAYOUT ── */
.test-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 0;
  min-height: calc(100vh - 56px);
}
@media (max-width: 700px) {
  .test-layout { grid-template-columns: 1fr; }
  .nav-panel { display: none; }
  .nav-panel.mobile-show { display: block; }
}

/* ── NAV PANEL (left) ── */
.nav-panel {
  background: var(--white);
  border-right: 1px solid var(--border);
  padding: 16px 12px;
  position: sticky;
  top: 56px;
  height: calc(100vh - 56px);
  overflow-y: auto;
}
.nav-panel-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .8px; color: var(--text-lt);
  margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.q-nav-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  margin-bottom: 16px;
}
.q-nav-btn {
  aspect-ratio: 1;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 12px; font-weight: 600;
  background: var(--white);
  cursor: pointer;
  transition: all .15s;
  color: var(--text-md);
  display: flex; align-items: center; justify-content: center;
}
.q-nav-btn:hover { border-color: var(--brand); color:var(--ink); background: var(--tint); }
.q-nav-btn.answered { background: var(--ink); border-color: var(--ink); color: var(--white); }
.q-nav-btn.current  { border-color: var(--brand); background: var(--brand); color: var(--white); box-shadow: 0 2px 8px rgba(6,54,114,.3); }

/* Legend */
.nav-legend { font-size: 11px; color: var(--text-lt); }
.legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.legend-dot { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }

/* Timer */
.timer-box {
  background: var(--brand);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  text-align: center;
  margin-bottom: 14px;
}
.timer-label { font-size: 10px; color: rgba(255,255,255,.65); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
.timer-value { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--white); letter-spacing: 1px; }
.timer-warn .timer-value { color: var(--gold-lt); }

/* Progress summary */
.nav-progress { margin-bottom: 14px; }
.nav-progress-bar { width: 100%; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.nav-progress-fill { height: 100%; background: var(--ink); border-radius: 3px; transition: width .3s; }
.nav-progress-txt { font-size: 11px; color: var(--text-lt); display: flex; justify-content: space-between; margin-top: 3px; }

/* ── MAIN CONTENT (right) ── */
.main-content { padding: 20px; max-width: 760px; }

/* Single question block (full width, scrollable) */
.main-content .qblock-active { padding: 22px 24px; }
@media (max-width: 700px) {
  .main-content { padding: 14px 12px; min-height: 0 !important; justify-content: flex-start !important; }
  .main-content .qblock-active { padding: 16px 14px; }
}
.qblock-active {
  animation: slideIn .25s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Nav buttons row */
.q-nav-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 20px; padding-top: 16px;
  border-top: 1px solid var(--border);
  gap: 10px;
}

/* Mobile nav toggle */
.mobile-nav-toggle {
  display: none;
  background: var(--brand);
  color: var(--white);
  border: none;
  border-radius: var(--r-sm);
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
}
@media (max-width: 700px) { .mobile-nav-toggle { display: inline-flex; } }
</style>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbwwx6KoClB_kwvEOC4-5lQcQgh6J8n0xm1x3SI33EHxzhc5PXugKlrVsNSdUnDjZDVZ/exec';
const Session={get:()=>{try{return JSON.parse(sessionStorage.getItem('ve_user')||'null');}catch(e){return null;}},set:(d)=>sessionStorage.setItem('ve_user',JSON.stringify(d)),clear:()=>sessionStorage.removeItem('ve_user'),require:(to)=>{var u=Session.get();if(!u){location.href=(to||'login.html');return null;}return u;},tGet:()=>sessionStorage.getItem('ve_teacher'),tSet:(p)=>sessionStorage.setItem('ve_teacher',p),tClear:()=>sessionStorage.removeItem('ve_teacher'),tRequire:()=>{var p=sessionStorage.getItem('ve_teacher');if(!p){location.href='teacher.html';return null;}return p;}};
async function api(action,payload,msg){payload=payload||{};msg=msg||'Đang xử lý...';showLoading(true,msg);try{var r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action:action},payload)),redirect:'follow'});return await r.json();}catch(e){return{ok:false,error:'Lỗi kết nối: '+e.message};}finally{showLoading(false);}}
function showLoading(on,msg){var el=document.getElementById('ov');if(!el)return;document.getElementById('ovMsg').textContent=msg||'Đang xử lý...';el.style.display=on?'flex':'none';}
function showErr(id,msg){var el=document.getElementById(id);if(!el)return;el.textContent=msg;el.style.display='block';}
function hideErr(id){var el=document.getElementById(id);if(el)el.style.display='none';}
</script>
</head>
<body class="light">
<div id="ov" style="display:none"><div class="spinner"></div><p id="ovMsg">Đang nộp bài...</p></div>

<!-- Sticky top nav -->
<nav class="nav" style="position:sticky;top:0;z-index:200">
  <div style="display:flex;align-items:center;gap:10px">
    <button class="btn btn-ghost btn-sm" onclick="goBack()">← Thoát</button>
    <button class="mobile-nav-toggle" onclick="toggleMobileNav()">☰ Số câu</button>
  </div>
  <div class="nav-brand"><div class="nav-brand-dot"></div>Ngữ Pháp & Từ Vựng</div>
  <div class="nav-r">
    <span class="txt-sm" id="cnt" style="min-width:50px;text-align:right">0 / 50</span>
  </div>
</nav>

<div class="test-layout">

  <!-- ── LEFT NAV PANEL ── -->
  <div class="nav-panel" id="navPanel">

    <!-- Timer -->
    <div class="timer-box" id="timerBox">
      <div class="timer-label">Thời gian</div>
      <div class="timer-value" id="timerVal">00:00</div>
    </div>

    <!-- Progress -->
    <div class="nav-progress">
      <div class="nav-progress-txt">
        <span>Đã trả lời</span>
        <span id="navPrgTxt">0 / 50</span>
      </div>
      <div class="nav-progress-bar">
        <div class="nav-progress-fill" id="navPrgFill" style="width:0%"></div>
      </div>
    </div>

    <!-- Question grid -->
    <div class="nav-panel-title">Câu hỏi</div>
    <div class="q-nav-grid" id="qNavGrid"></div>

    <!-- Legend -->
    <div class="nav-legend">
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--ink)"></div>
        <span>Đã trả lời</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--brand)"></div>
        <span>Câu hiện tại</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:var(--white);border:1.5px solid var(--border)"></div>
        <span>Chưa trả lời</span>
      </div>
    </div>

    <!-- Submit button -->
    <button class="btn btn-primary btn-full" style="margin-top:16px" onclick="submitVG()">
      Nộp bài →
    </button>
    <div id="navErrMsg" style="display:none;font-size:12px;color:var(--red);margin-top:8px;text-align:center"></div>
  </div>

  <!-- ── RIGHT: QUESTION CONTENT ── -->
  <div class="main-content" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 56px)">
    <div id="questionArea" style="width:100%;max-width:780px"></div>
    <div id="submitErr" class="al-error" style="display:none;margin-top:16px;width:100%;max-width:780px"></div>
    <div style="width:100%;max-width:780px;display:flex;justify-content:space-between;align-items:center;margin-top:20px">
      <button class="btn btn-ghost" id="btnPrev" onclick="goPrev()">← Câu trước</button>
      <span class="txt-sm" id="qPositionTxt" style="color:var(--text-lt)">Câu 1 / 50</span>
      <button class="btn btn-primary" id="btnNext" onclick="goNext()">Câu sau →</button>
    </div>
  </div>

</div><!-- /test-layout -->

<script>var user = Session.require();
if (!user) { location.href = 'login.html'; }
else if (user && user.vgDone) { location.href = 'dashboard.html'; }

var answers = {};
var currentQ = 1;
var totalQ = 50;
var timerSec = 0;
var timerInterval = null;
var exitCount = 0;
var pageHidden = false;
var tabHiddenAt = 0;
var QS = [
  {n:1,q:"I'm 18 and my brother is 20, so he's ........ me.",o:["a. the oldest of","b. older than","c. as old as"]},
  {n:2,q:"Carl's very ........ He's never late, and he never forgets to do things.",o:["a. reliable","b. patient","c. strict"]},
  {n:3,q:"We stayed in a lovely villa ........ the sea.",o:["a. it overlooks","b. overlooked","c. overlooking"]},
  {n:4,q:"Not until the 1980s ........ for the average person to own a computer.",o:["a. it was possible","b. was it possible","c. was possible"]},
  {n:5,q:"Jan ........ her arm on a hot iron.",o:["a. broke","b. burned","c. sprained"]},
  {n:6,q:"Tomorrow's a holiday, so we ........ go to work.",o:["a. have to","b. mustn't","c. don't have to"]},
  {n:7,q:"I usually ........ swimming at least once a week.",o:["a. go","b. do","c. play"]},
  {n:8,q:"My friend Siena ........ to Russia last year.",o:["a. went","b. has gone","c. has been"]},
  {n:9,q:"This is ........ area, with a lot of factories and warehouses.",o:["a. an agricultural","b. an industrial","c. a residential"]},
  {n:10,q:"If I ........ well in my exams, I ........ to university.",o:["a. will do / will go","b. will do / go","c. do / will go"]},
  {n:11,q:"She was so upset that she burst ........ tears.",o:["a. into","b. out","c. with"]},
  {n:12,q:"Where did you go ........ holiday last year?",o:["a. for","b. on","c. to"]},
  {n:13,q:"Ocean currents ........ play an important part in regulating global climate.",o:["a. are known to","b. thought to","c. are believed that they"]},
  {n:14,q:"My cousin ........ getting a job in Bahrain.",o:["a. would like","b. is planning","c. is thinking of"]},
  {n:15,q:"I can't ........ your hair, because I haven't got any scissors.",o:["a. brush","b. cut","c. wash"]},
  {n:16,q:"I wish I ........ have an exam tomorrow!",o:["a. don't","b. didn't","c. won't"]},
  {n:17,q:"The government plans to ........ taxes on sales of luxury items.",o:["a. increase","b. expand","c. go up"]},
  {n:18,q:"When I first moved to Hong Kong, life in a different country was very strange, but now I'm used ........ here.",o:["a. living","b. to live","c. to living"]},
  {n:19,q:"There ........ milk in the fridge.",o:["a. is some","b. are some","c. is a"]},
  {n:20,q:"Criminals are people who are guilty of ........ the law.",o:["a. breaking","b. cheating","c. committing"]},
  {n:21,q:"Why on earth isn't Josh here yet? ........ for him for over an hour!",o:["a. I'm waiting","b. I've been waiting","c. I've waited"]},
  {n:22,q:'"It\'s pouring down, and it\'s freezing." What are the weather conditions?',o:["a. high winds and snow","b. heavy rain and cold temperatures","c. thick cloud but quite warm"]},
  {n:23,q:"........ feeling OK? You don't look very well.",o:["a. Do you","b. You are","c. Are you"]},
  {n:24,q:"Daniel's hair is getting far too long; he should ........ soon.",o:["a. cut it","b. have cut it","c. have it cut"]},
  {n:25,q:"Mandy works for a computer software company. She got ........ recently, and so now she's an area manager.",o:["a. made redundant","b. promoted","c. a raise"]},
  {n:26,q:"I can't hear you — it's ........ noisy in here.",o:["a. too","b. too much","c. too many"]},
  {n:27,q:"Jamal has just sent me ........ to arrange plans for this weekend.",o:["a. a blog","b. an email","c. a website"]},
  {n:28,q:"I promise I'll call you as soon as I ........ .",o:["a. arrive","b. arrived","c. will arrive"]},
  {n:29,q:"Photographers and designers need to be very ........ .",o:["a. creative","b. fit","c. annoying"]},
  {n:30,q:"The global financial crisis, ........ is forcing lots of small businesses to close, does not look set to end soon.",o:["a. it","b. that","c. which"]},
  {n:31,q:"There ........ a terrible accident if the pilot hadn't reacted so quickly.",o:["a. had been","b. was","c. would have been"]},
  {n:32,q:'"Are you ready to order?" "Not yet — I\'m still looking at the ........"',o:["a. bill","b. menu","c. service"]},
  {n:33,q:'"My job is never boring." The speaker\'s job is always ........ .',o:["a. interesting","b. popular","c. difficult"]},
  {n:34,q:"I've been working here ........ about the last two years.",o:["a. during","b. for","c. since"]},
  {n:35,q:'"It leaves from Platform 2 at 4.15." The speaker is talking about ........ .',o:["a. an airline flight","b. a train","c. a taxi"]},
  {n:36,q:"I went to a lovely ........ last Saturday. The bride was my best friend when we were at school.",o:["a. anniversary","b. marriage","c. wedding"]},
  {n:37,q:'"I\'ve got a headache." "Maybe you ........ to take an aspirin."',o:["a. should","b. ought","c. would"]},
  {n:38,q:"I'll never get used to ........ on the left.",o:["a. drive","b. driving","c. drove"]},
  {n:39,q:"The ........ in that country is very high, so most people can read and write.",o:["a. literacy rate","b. birth rate","c. mortality rate"]},
  {n:40,q:"I was sure I had put my keys somewhere, but I couldn't ........ them.",o:["a. find out","b. come across","c. find"]},
  {n:41,q:"The area used to be quite ........, but since the buildings were renovated, it's become quite fashionable.",o:["a. a trendy","b. a rundown","c. an affluent"]},
  {n:42,q:"The news from the hospital isn't good — I hope she ........ soon.",o:["a. recovers","b. repairs","c. heals"]},
  {n:43,q:"If only I ........ to him — things would have been so different.",o:["a. had listened","b. listened","c. would have listened"]},
  {n:44,q:"The ........ from the concert hall was so great that we could hear it from our house.",o:["a. music","b. sound","c. noise"]},
  {n:45,q:"Scientists have made a significant ........ in the fight against malaria.",o:["a. breakthrough","b. investigation","c. discovery"]},
  {n:46,q:"I couldn't ........ the answer to the puzzle.",o:["a. check in","b. look up","c. work out"]},
  {n:47,q:"The charity depends ........ on donations from the public.",o:["a. mainly","b. heavily","c. largely"]},
  {n:48,q:"The committee was ........ of ten members, all of whom were experts in their fields.",o:["a. formed","b. made","c. comprised"]},
  {n:49,q:"........ worries me most is the lack of communication between departments.",o:["a. That","b. What","c. Which"]},
  {n:50,q:"I wouldn't say the policy is wrong ........; I'd say it's badly timed.",o:["a. as such","b. by itself","c. in its own"]},
  ];

if (user && !user.vgDone) {
  api('trackActivity', {username: user.username, testType:'vg', action:'enter', note:'Start session'});
  buildNavGrid();
  showQuestion(1);
  startTimer();
}

function startTimer() {
  timerInterval = setInterval(function() {
    timerSec++;
    var m = Math.floor(timerSec / 60);
    var s = timerSec % 60;
    document.getElementById('timerVal').textContent =
      String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }, 1000);
}

// ── BUILD NAV GRID ──
function buildNavGrid() {
  var grid = document.getElementById('qNavGrid');
  grid.innerHTML = '';
  for (var i = 1; i <= totalQ; i++) {
    var btn = document.createElement('button');
    btn.className = 'q-nav-btn' + (i === currentQ ? ' current' : '');
    btn.textContent = i;
    btn.id = 'navbtn' + i;
    (function(n) {
      btn.onclick = function() { goToQuestion(n); };
    })(i);
    grid.appendChild(btn);
  }
}

// ── SHOW SINGLE QUESTION (large, full content area) ──
function showQuestion(n) {
  currentQ = n;
  var q = QS[n - 1];
  var selected = answers[n] || null;
  var area = document.getElementById('questionArea');

  area.innerHTML = '<div class="qblock qblock-active" id="qb' + n + '">'
    + '<div class="q-num" style="font-size:13px;margin-bottom:14px">Câu ' + n + ' / ' + totalQ + '</div>'
    + '<div class="q-text" id="qtxt' + n + '" style="font-size:19px;line-height:1.55;margin-bottom:18px;font-weight:500">' + q.q + '</div>'
    + '<div class="q-opts" style="gap:12px">'
    + q.o.map(function(opt, i) {
        var l = ['a','b','c'][i];
        var isSel = selected === l;
        return '<label class="q-opt' + (isSel?' on':'') + '" id="qo' + n + '_' + l + '" style="padding:12px 14px;font-size:15px">'
          + '<input type="radio" name="q' + n + '" value="' + l + '" style="width:20px;height:20px"'
          + (isSel?' checked':'')
          + ' onchange="pick(' + n + ',\'' + l + '\')">'
          + ' ' + opt + '</label>';
      }).join('')
    + '</div></div>';

  // Update nav buttons
  document.querySelectorAll('.q-nav-btn').forEach(function(b, i) {
    b.classList.remove('current','answered');
    var qn = i + 1;
    if (qn === n) b.classList.add('current');
    else if (answers[qn]) b.classList.add('answered');
  });

  document.getElementById('qPositionTxt').textContent = 'Câu ' + n + ' / ' + totalQ;
  document.getElementById('btnPrev').disabled = (n <= 1);
  document.getElementById('btnNext').textContent = n < totalQ ? 'Câu sau →' : 'Xem lại & Nộp';

  window.scrollTo(0, 0);
  setTimeout(function() { protectAllQuestions(); }, 80);
}

function goToQuestion(n) {
  if (n < 1 || n > totalQ) return;
  showQuestion(n);
}

function goNext() {
  if (currentQ < totalQ) { goToQuestion(currentQ + 1); return; }
  var unanswered = [];
  for (var i = 1; i <= totalQ; i++) if (!answers[i]) unanswered.push(i);
  if (unanswered.length > 0) {
    document.getElementById('submitErr').textContent = 'Còn ' + unanswered.length + ' câu chưa trả lời. Các câu được tô vàng trong danh sách bên trái.';
    document.getElementById('submitErr').style.display = 'block';
    unanswered.forEach(function(n) {
      var btn = document.getElementById('navbtn'+n);
      if (btn) btn.style.background = '#fef3c7';
    });
    goToQuestion(unanswered[0]);
  } else {
    submitVG();
  }
}

function goPrev() { goToQuestion(Math.max(1, currentQ - 1)); }

// ── PICK ANSWER ──
function pick(n, l) {
  answers[n] = l;
  ['a','b','c'].forEach(function(x) {
    var el = document.getElementById('qo' + n + '_' + x);
    if (el) el.classList.toggle('on', x === l);
  });
  var navBtn = document.getElementById('navbtn' + n);
  if (navBtn) { navBtn.style.background=''; navBtn.classList.remove('current'); navBtn.classList.add('answered'); }
  document.querySelectorAll('.q-nav-btn').forEach(function(b,i) {
    if (i + 1 === currentQ) b.classList.add('current');
  });
  updateProgress();
}

function updateProgress() {
  var cnt = Object.keys(answers).length;
  document.getElementById('cnt').textContent = cnt + ' / 50';
  document.getElementById('navPrgTxt').textContent = cnt + ' / 50';
  document.getElementById('navPrgFill').style.width = (cnt / 50 * 100) + '%';
}

// ── SUBMIT ──
async function submitVG() {
  var unanswered = QS.map(function(q){return q.n;}).filter(function(n){return !answers[n];});
  var errEl = document.getElementById('submitErr');
  if (unanswered.length > 0) {
    errEl.textContent = 'Còn ' + unanswered.length + ' câu chưa trả lời. Vui lòng trả lời đủ trước khi nộp.';
    errEl.style.display = 'block';
    // Highlight unanswered in nav
    unanswered.forEach(function(n) {
      var btn = document.getElementById('navbtn'+n);
      if (btn) btn.style.background = '#fef3c7';
    });
    goToQuestion(unanswered[0]);
    return;
  }
  errEl.style.display = 'none';
  clearInterval(timerInterval);
  var res = await api('submitVG', {username: user.username, answers: answers});
  if (!res.ok) { showErr('submitErr', res.error); errEl.style.display = 'block'; return; }
  user.vgDone = true;
  Session.set(user);
  location.href = 'done.html?test=vg';
}

// ── EXIT TRACKING ──
var confirmingExit = false;

function goBack() {
  exitCount++;
  var confirmed = confirm(
    'Bạn có chắc muốn thoát?\n\n' +
    '⚠️ Lưu ý: Giáo viên sẽ ghi nhận bạn đã thoát khỏi bài thi này.\n' +
    'Hành động này sẽ được ghi lại trong hệ thống.\n\n' +
    'Nhấn OK để thoát, Cancel để tiếp tục làm bài.'
  );
  if (confirmed) {
    clearInterval(timerInterval);
    api('trackActivity', {
      username: user.username,
      testType: 'vg',
      action: 'exit',
      note: 'Thoat sau ' + timerSec + 'giay, da lam ' + Object.keys(answers).length + '/50 cau'
    });
    setTimeout(function() { location.href = 'dashboard.html'; }, 200);
  }
}

// ═══ TAB SWITCH DETECTION — dừng đồng hồ, cảnh báo, ghi log ═══
var tabHiddenAt = 0;
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    pageHidden = true;
    tabHiddenAt = Date.now();
    // Dừng đồng hồ ngay lập tức
    if (typeof timerInterval !== 'undefined' && timerInterval) clearInterval(timerInterval);
    api('trackActivity', {
      username: user.username,
      testType: 'vg',
      action: 'tab_hidden',
      note: 'Chuyen tab luc ' + (typeof timerSec!=='undefined'?timerSec:0) + 'giay'
    });
  } else if (pageHidden) {
    pageHidden = false;
    var awaySec = Math.round((Date.now() - tabHiddenAt) / 1000);
    api('trackActivity', {
      username: user.username,
      testType: 'vg',
      action: 'tab_returned',
      note: 'Quay lai sau ' + awaySec + 'giay roi khoi tab'
    });
    // Khởi động lại đồng hồ
    if (typeof startTimer === 'function') startTimer();
    // Cảnh báo to cho sinh viên
    showTabWarning();
  }
});

function showTabWarning() {
  var ov = document.createElement('div');
  ov.id = 'tabWarnOverlay';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(155,11,34,.96);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:32px;font-family:var(--font);';
  ov.innerHTML = '<div style="font-size:48px;margin-bottom:16px">⚠️</div>'
    + '<h2 style="font-family:var(--serif);font-size:24px;margin-bottom:12px">Bạn vừa chuyển tab!</h2>'
    + '<p style="font-size:16px;max-width:480px;line-height:1.6;margin-bottom:24px">Hành động này đã được ghi nhận và sẽ thông báo cho giáo viên biết. Vui lòng tiếp tục làm bài và không rời khỏi trang trong lúc thi.</p>'
    + '<button id="tabWarnClose" style="background:#fff;color:#dc2626;border:none;padding:12px 32px;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer">Tôi đã hiểu, tiếp tục làm bài</button>';
  document.body.appendChild(ov);
  document.getElementById('tabWarnClose').onclick = function() { ov.remove(); };
}

// Cấm chuột phải trong khi làm bài (chống copy/inspect dễ dàng)
document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
// Cấm phím tắt phổ biến để copy/devtools
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && (e.key==='c'||e.key==='C'||e.key==='u'||e.key==='U'||e.key==='s'||e.key==='S')) {
    e.preventDefault(); return false;
  }
  if (e.key === 'F12') { e.preventDefault(); return false; }
  if (e.ctrlKey && e.shiftKey && (e.key==='I'||e.key==='i'||e.key==='J'||e.key==='j'||e.key==='C'||e.key==='c')) {
    e.preventDefault(); return false;
  }
});

// Block beforeunload
window.addEventListener('beforeunload', function(e) {
  if (!user.vgDone) {
    e.preventDefault();
    e.returnValue = 'Bạn có chắc muốn thoát? Tiến trình chưa được lưu.';
    return e.returnValue;
  }
});

// Mobile nav toggle
function toggleMobileNav() {
  var panel = document.getElementById('navPanel');
  panel.classList.toggle('mobile-show');
}
</script>

<script>


// ═══════════════════════════════════════
// CANVAS QUESTION RENDERER
// Renders question text as PNG image — blocks copy/translate/select
// ═══════════════════════════════════════
function renderQuestionAsImage(text, maxWidth) {
  maxWidth = maxWidth || 600;
  var dpr = window.devicePixelRatio || 1;
  var fontSize = 17;
  var lineHeight = fontSize * 1.6;
  var padding = 0;
  var fontFace = '500 ' + fontSize + 'px "Be Vietnam Pro", system-ui, sans-serif';

  // Measure and wrap text
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d');
  ctx.font = fontFace;

  function wrapText(txt, maxW) {
    var words = txt.split(' ');
    var lines = [];
    var current = '';
    words.forEach(function(w) {
      var test = current ? current + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && current) {
        lines.push(current);
        current = w;
      } else {
        current = test;
      }
    });
    if (current) lines.push(current);
    return lines;
  }

  var usableWidth = maxWidth - padding * 2;
  var lines = wrapText(text, usableWidth);
  var h = lines.length * lineHeight + padding * 2;

  canvas.width = maxWidth * dpr;
  canvas.height = h * dpr;
  canvas.style.width = maxWidth + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  // Background transparent
  ctx.clearRect(0, 0, maxWidth, h);

  // Text
  ctx.font = fontFace;
  ctx.fillStyle = '#16181D';
  ctx.textBaseline = 'top';
  lines.forEach(function(line, i) {
    ctx.fillText(line, padding, padding + i * lineHeight);
  });

  var img = new Image();
  img.src = canvas.toDataURL('image/png');
  img.style.display = 'block';
  img.style.userSelect = 'none';
  img.style.webkitUserSelect = 'none';
  img.style.pointerEvents = 'none';
  img.style.maxWidth = '100%';
  img.draggable = false;
  return img;
}

function renderOptionAsImage(text, maxWidth) {
  maxWidth = maxWidth || 560;
  var dpr = window.devicePixelRatio || 1;
  var fontSize = 16;
  var lineHeight = fontSize * 1.55;
  var fontFace = fontSize + 'px "Be Vietnam Pro", system-ui, sans-serif';

  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d');
  ctx.font = fontFace;

  function wrapText(txt, maxW) {
    var words = txt.split(' ');
    var lines = []; var current = '';
    words.forEach(function(w) {
      var test = current ? current + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && current) { lines.push(current); current = w; }
      else { current = test; }
    });
    if (current) lines.push(current);
    return lines;
  }

  var lines = wrapText(text, maxWidth);
  var h = lines.length * lineHeight + 4;
  canvas.width = maxWidth * dpr;
  canvas.height = h * dpr;
  canvas.style.width = maxWidth + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, maxWidth, h);
  ctx.font = fontFace;
  ctx.fillStyle = '#4A4F5A';
  ctx.textBaseline = 'top';
  lines.forEach(function(line, i) { ctx.fillText(line, 0, 2 + i * lineHeight); });

  var img = new Image();
  img.src = canvas.toDataURL('image/png');
  img.style.display = 'block';
  img.style.userSelect = 'none';
  img.style.webkitUserSelect = 'none';
  img.style.pointerEvents = 'none';
  img.style.maxWidth = '100%';
  img.draggable = false;
  return img;
}

// Apply to all .q-text and .q-opt label text
function protectAllQuestions() {
  var container = document.getElementById('qs') || document.getElementById('parts');
  if (!container) return;
  var maxW = Math.min(container.offsetWidth - 32, 620);

  // Replace q-text content with canvas image
  container.querySelectorAll('.q-text').forEach(function(el) {
    var txt = el.textContent.trim();
    if (!txt) return;
    el.innerHTML = '';
    el.appendChild(renderQuestionAsImage(txt, maxW));
  });

  // Replace option text (keep radio input, replace text node)
  container.querySelectorAll('.q-opt').forEach(function(label) {
    var input = label.querySelector('input');
    var txt = label.textContent.trim();
    if (!txt || !input) return;
    label.innerHTML = '';
    label.appendChild(input);
    label.appendChild(renderOptionAsImage(txt, maxW - 32));
    label.style.alignItems = 'center';
    label.style.gap = '10px';
  });
}

// Anti-copy/translate measures
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('selectstart', function(e) {
  // Allow selecting form inputs
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  e.preventDefault();
});
document.addEventListener('copy', function(e) { e.preventDefault(); });
document.addEventListener('keydown', function(e) {
  // Block Ctrl+A, Ctrl+C, Ctrl+U (view source)
  if (e.ctrlKey && (e.key==='a'||e.key==='c'||e.key==='u'||e.key==='s')) e.preventDefault();
  // Block F12
  if (e.key==='F12') e.preventDefault();
});

// Call after questions are rendered
window.addEventListener('load', function() {
  setTimeout(protectAllQuestions, 100);
});

</script>
