<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng Nhập — Venus English Placement Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwwx6KoClB_kwvEOC4-5lQcQgh6J8n0xm1x3SI33EHxzhc5PXugKlrVsNSdUnDjZDVZ/exec';
const Session = {
  get: () => { try { return JSON.parse(sessionStorage.getItem('ve_user')||'null'); } catch(e){ return null; } },
  set: (d) => sessionStorage.setItem('ve_user', JSON.stringify(d)),
  clear: () => sessionStorage.removeItem('ve_user'),
  require: (to='login.html') => { const u=Session.get(); if(!u){location.href=to;return null;} return u; },
  tGet: () => sessionStorage.getItem('ve_teacher'),
  tSet: (p) => sessionStorage.setItem('ve_teacher', p),
  tClear: () => sessionStorage.removeItem('ve_teacher'),
  tRequire: () => { const p=sessionStorage.getItem('ve_teacher'); if(!p){location.href='teacher.html';return null;} return p; }
};
async function api(action, payload={}, msg='Đang xử lý...') {
  showLoading(true, msg);
  try {
    const r = await fetch(GAS_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({action,...payload}), redirect:'follow'});
    return await r.json();
  } catch(e) { return {ok:false,error:'Lỗi kết nối: '+e.message}; }
  finally { showLoading(false); }
}
function showLoading(on, msg='Đang xử lý...') {
  const el=document.getElementById('ov'); if(!el) return;
  document.getElementById('ovMsg').textContent=msg; el.style.display=on?'flex':'none';
}
function showErr(id, msg) { const el=document.getElementById(id); if(!el) return; el.textContent=msg; el.style.display='block'; }
function hideErr(id) { const el=document.getElementById(id); if(el) el.style.display='none'; }
</script>
</head>
<body>
<div id="ov" style="display:none"><div class="spinner"></div><p id="ovMsg">Đang xử lý...</p></div>

<div class="hero">
  <div class="hero-logo">
    <div class="hero-logo-mark">V</div>
    <div>
      <div class="hero-logo-text">Venus English</div>
      <div class="hero-logo-sub">IELTS Placement Test</div>
    </div>
  </div>
  <h1>Đăng Nhập</h1>
  <p>Nhập tên tài khoản đã nhận qua email để vào làm bài</p>
</div>

<div class="wrap">
  <div class="card">
    <div class="card-title">Tài khoản thí sinh</div>
    <div class="card-sub">Username có dạng <strong>Tên.kt_DDMM</strong> · ví dụ <code>An.nv_3004</code></div>

    <div class="field">
      <label>Tên tài khoản *</label>
      <input type="text" id="uname" placeholder="An.nv_3004" autocomplete="username" autocapitalize="none">
    </div>

    <div id="errLogin" class="al-error" style="display:none"></div>

    <button class="btn btn-primary btn-full mt-16" onclick="doLogin()">Đăng nhập →</button>

    <div class="divider"></div>
    <p class="txt-sm txt-center">Chưa có tài khoản? <a href="index.html" class="link">Đăng ký tại đây</a></p>
    <p class="txt-sm txt-center" style="margin-top:8px">Giáo viên? <a href="teacher.html" class="link">Vào trang giáo viên</a></p>
  </div>
</div>

<script>
// Auto-redirect if already logged in
if (Session.get()) location.href = 'dashboard.html';

document.getElementById('uname').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });

async function doLogin() {
  const username = document.getElementById('uname').value.trim();
  hideErr('errLogin');
  if (!username) { showErr('errLogin','Vui lòng nhập tên tài khoản.'); return; }

  const res = await api('login', { username });
  if (!res.ok) { showErr('errLogin', res.error); return; }

  Session.set(res.student);
  location.href = 'dashboard.html';
}
</script>
</body>
</html>
